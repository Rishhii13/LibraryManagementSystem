version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:latest
    container_name: library_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Full-Stack App Service
  app:
    build: .
    container_name: library_app
    ports:
      - "5173:5173"
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/library
      - PORT=5000
    depends_on:
      - mongodb

volumes:
  mongo-data: